plugins { id 'com.android.application' }

android {
    namespace 'com.nihongopath.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.nihongopath.app"
        minSdk 24
        targetSdk 35
        versionCode 20
        versionName "3.8"
    }

    // A fixed, committed signing key so every build (here or in Android Studio) can
    // install as an UPDATE over the previous one. It is not a Play Store upload key.
    signingConfigs {
        shared {
            storeFile file("nihongopath.keystore")
            storePassword "nihongopath"
            keyAlias "nihongopath"
            keyPassword "nihongopath"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
        debug { signingConfig signingConfigs.shared }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['json'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
